name: Update DART data and deploy Pages

on:
  schedule:
    # 매월 1일 09:15 KST = 00:15 UTC
    - cron: "15 0 1 * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "HJ_YuHan_DART_Agent/src/**"
      - "HJ_YuHan_DART_Agent/docs/index.html"
      - "HJ_YuHan_DART_Agent/docs/data/rnd_costs.csv"
      - "HJ_YuHan_DART_Agent/README.md"
      - ".github/workflows/update-dart-and-deploy.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: HJ_YuHan_DART_Agent
        run: pip install -r requirements.txt

      - name: Update OpenDART financial data
        working-directory: HJ_YuHan_DART_Agent
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python src/update.py

      - name: Commit updated data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HJ_YuHan_DART_Agent/data HJ_YuHan_DART_Agent/docs/data

          if git diff --cached --quiet; then
            echo "No financial data changes to commit."
            exit 0
          fi

          git commit -m "chore: monthly OpenDART data update"

          # Another commit (for example a dashboard edit) can reach main while
          # the scheduled data refresh is running. Rebase the generated commit
          # onto the latest main before pushing, and retry a concurrent push race.
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Could not rebase generated data changes onto origin/main. Check for conflicting edits to generated data files."
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Financial data update pushed successfully."
              exit 0
            fi

            echo "Push raced with another main update (attempt ${attempt}/3). Retrying."
            if [ "${attempt}" -lt 3 ]; then
              sleep $((attempt * 2))
            fi
          done

          echo "::error::Could not push financial data update after 3 attempts."
          exit 1

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: HJ_YuHan_DART_Agent/docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
