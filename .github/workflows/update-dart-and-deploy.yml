name: Update DART data and deploy Pages

on:
  schedule:
    # 매월 1일 09:15 KST = 00:15 UTC
    - cron: "15 0 1 * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "HJ_YuHan_DART_Agent/src/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: HJ_YuHan_DART_Agent
        run: pip install -r requirements.txt

      - name: Update OpenDART financial data
        working-directory: HJ_YuHan_DART_Agent
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python src/update.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HJ_YuHan_DART_Agent/data                   HJ_YuHan_DART_Agent/docs/data
          git diff --cached --quiet ||             git commit -m "chore: monthly OpenDART data update"
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: HJ_YuHan_DART_Agent/docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
